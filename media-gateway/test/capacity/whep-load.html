<!doctype html><meta charset="utf-8"><script>
const sleep=m=>new Promise(r=>setTimeout(r,m));
async function one(url,id){const pc=new RTCPeerConnection();pc.addTransceiver('video',{direction:'recvonly'});pc.addTransceiver('audio',{direction:'recvonly'});const t=performance.now();let reconnects=0;pc.onconnectionstatechange=()=>{if(pc.connectionState==='disconnected')reconnects++};await pc.setLocalDescription(await pc.createOffer());await new Promise(r=>pc.iceGatheringState==='complete'?r():pc.onicegatheringstatechange=()=>pc.iceGatheringState==='complete'&&r());const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/sdp'},body:pc.localDescription.sdp});if(!res.ok)throw Error(res.status+' '+await res.text());await pc.setRemoteDescription({type:'answer',sdp:await res.text()});await new Promise((r,j)=>{const x=setTimeout(()=>j(Error('connect timeout')),15000);pc.onconnectionstatechange=()=>{if(pc.connectionState==='connected'){clearTimeout(x);r()}else if(pc.connectionState==='failed'){clearTimeout(x);j(Error('failed'))}}});return {pc,startup:performance.now()-t,reconnects,id}}
window.runLoad=async(url,count,holdMs)=>{const begun=performance.now(),ok=[],failed=[];for(let i=0;i<count;i+=25){const batch=await Promise.allSettled(Array.from({length:Math.min(25,count-i)},(_,j)=>one(url,i+j)));for(const r of batch)(r.status==='fulfilled'?ok:failed).push(r.status==='fulfilled'?r.value:String(r.reason));await sleep(100)}await sleep(holdMs);let packetsLost=0,jitter=0,frames=0,dropped=0,bytes=0,direct=0,tcp=0,turn=0;for(const x of ok){const stats=await x.pc.getStats();for(const s of stats.values()){if(s.type==='inbound-rtp'&&s.kind==='video'){packetsLost+=s.packetsLost||0;jitter+=s.jitter||0;frames+=s.framesDecoded||0;dropped+=s.framesDropped||0;bytes+=s.bytesReceived||0}if(s.type==='candidate-pair'&&s.state==='succeeded'&&s.nominated){const l=stats.get(s.localCandidateId);if(l?.candidateType==='relay')turn++;else direct++;if(l?.protocol==='tcp')tcp++}}}const starts=ok.map(x=>x.startup).sort((a,b)=>a-b);const result={requested:count,connected:ok.length,failed:failed.length,errors:failed.slice(0,3),avgStartupMs:starts.reduce((a,b)=>a+b,0)/(starts.length||1),p95StartupMs:starts[Math.floor(starts.length*.95)]||0,packetsLost,jitterAvg:jitter/(ok.length||1),framesDecoded:frames,framesDropped:dropped,bytesReceived:bytes,direct,tcp,turn,reconnects:ok.reduce((a,x)=>a+x.reconnects,0),elapsedMs:performance.now()-begun};for(const x of ok)x.pc.close();return result};
</script>
